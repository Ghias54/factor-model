[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factor-model"
version = "0.1.0"
description = "Machine learning for factor investing — UIUC Financial Engineering Club"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "psycopg[binary]",
    "sqlalchemy",
    "python-dotenv",
    "pyyaml",
    "scikit-learn",
    "xgboost",
    "lightgbm",
    "torch",
    "shap",
    "statsmodels",
    "matplotlib",
    "joblib",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "jupyter", "nbstripout"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
